<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml"
        href="https://github.com/Yashhh710/FoodieExpress/blob/main/public/favicon.png?raw=true" />
  <title>Flavoria</title>
  <link rel="stylesheet" href="globals.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style-fix.css" />  
</head>
<body>

  <div class="desktop-scaler" id="desktopScaler">
    <div class="desktop">

      <img class="image"    src="img/image_6.png"  />
      <img class="img"      src="img/image_9.png"  />
      <img class="image-2"  src="img/image_1.png"  />
      <img class="image-3"  src="img/image_2.png"  />
      <img class="image-4"  src="img/image_3.png"  />
      <img class="image-5"  src="img/image_5.png"  />
      <img class="image-6"  src="img/image_7.png"  />
      <img class="image-7"  src="img/image_4.png"  />
      <img class="image-8"  src="img/image_8.png"  />
      <img class="image-9"  src="img/image_10.png" />
      <img class="image-10" src="img/image_11.png" />
      <img class="image-11" src="img/image_12.png" />
      <img class="image-12" src="img/image_14.png" />
      <img class="image-13" src="img/image_15.png" />
      <img class="image-14" src="img/image_13.png" />
      <img class="image-15" src="img/image_17.png" />
      <img class="image-16" src="img/image_16.png" />

    </div>
  </div>

  <script>
    const ARTBOARD_W = 1536;

    function applyScale() {
      const scaler  = document.getElementById('desktopScaler');
      const desktop = scaler.querySelector('.desktop');
      const scale   = Math.min(window.innerWidth / ARTBOARD_W, 1); 

      scaler.style.setProperty('--vw-scale', scale);

      const artboardH = desktop.offsetHeight || parseInt(
        getComputedStyle(desktop).minHeight, 10
      );
      scaler.style.height = (artboardH * scale) + 'px';
    }

    applyScale();
    window.addEventListener('resize', applyScale);
  </script>
</body>
</html>
